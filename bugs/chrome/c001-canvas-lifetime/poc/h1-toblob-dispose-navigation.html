<!doctype html>
<meta charset="utf-8">
<title>C001 H1 toBlob dispose/navigation</title>
<script>
const log = [];
function say(x) {
  log.push(x);
  document.body.textContent = log.join("\n");
}

function pressure() {
  const junk = [];
  for (let i = 0; i < 120; i++) {
    junk.push(new Uint8Array(1024 * 1024));
  }
  if (window.gc) gc();
}

async function one(iter) {
  const iframe = document.createElement("iframe");
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  const canvas = doc.createElement("canvas");
  canvas.width = 4096;
  canvas.height = 4096;
  doc.body.appendChild(canvas);
  const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  ctx.fillStyle = iter & 1 ? "#f00" : "#00f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let called = false;
  canvas.toBlob(blob => {
    called = true;
    if (blob && blob.size < 0) say("impossible");
  }, "image/png");

  canvas.width = iter % 2 ? 0 : 1;
  canvas.height = iter % 3 ? 0 : 1;
  canvas.remove();
  iframe.remove();
  pressure();
  await new Promise(resolve => setTimeout(resolve, 0));
  return called;
}

(async () => {
  say("H1 start");
  let callbacks = 0;
  for (let i = 0; i < 80; i++) {
    callbacks += await one(i) ? 1 : 0;
    if (i % 10 === 0) say("iter " + i + " callbacks=" + callbacks);
  }
  say("H1 done callbacks=" + callbacks);
})();
</script>
